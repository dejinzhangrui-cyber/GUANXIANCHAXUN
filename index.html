<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焊口查询与工作台</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial; margin: 0; padding: 10px; background: #f5f5f5; }
        h1 { font-size: 20px; text-align: center; color: #333; margin: 10px 0; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); overflow-x: auto; }
        .search-box { display: flex; margin-bottom: 12px; }
        input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px 0 0 5px; box-sizing: border-box; }
        .search-box button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 0 5px 5px 0; cursor: pointer; }
        button { padding: 8px 15px; font-size: 14px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button.green { background: #28a745; }
        button.red { background: #dc3545; }
        button.gray { background: #6c757d; }
        .full-btn { width: 100%; margin-top: 8px; padding: 12px; font-size: 16px; }

        .stat { display: flex; justify-content: space-around; margin-bottom: 12px; background: #fff; padding: 10px; border-radius: 5px; }
        .stat-item { text-align: center; flex: 1; }
        .stat-item span { display: block; font-size: 24px; font-weight: bold; color: #007bff; }
        .stat-item label { font-size: 12px; color: #666; }

        .result-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .result-item h3 { margin: 0 0 5px; color: #007bff; }
        .result-item p { margin: 3px 0; font-size: 14px; }
        .result-item .detect { background: #f9f9f9; padding: 8px; border-radius: 5px; margin-top: 5px; font-size: 13px; }

        /* 控制台表格 */
        table { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
        th, td { border: 1px solid #ddd; padding: 4px; text-align: center; }
        th { background: #f0f0f0; font-weight: bold; font-size: 11px; }
        td input { width: 55px; padding: 6px 3px; box-sizing: border-box; border: 1px solid #eee; border-radius: 3px; font-size: 12px; text-align: center; }
        td input.wide { width: 110px; text-align: left; }
        td input[type="date"] { width: 120px; }

        .summary { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: #fffbe6; border: 1px solid #ffe58f; border-radius: 8px; }
        .sum-item { text-align: center; min-width: 60px; padding: 5px 8px; background: #fff; border-radius: 5px; }
        .sum-item span { display: block; font-size: 18px; font-weight: bold; color: #d46b08; }
        .sum-item label { font-size: 11px; color: #666; }

        .hidden { display: none; }
        .admin-entry { text-align: center; margin-top: 30px; }
        .admin-entry a { color: #aaa; font-size: 13px; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>焊口查询系统</h1>

    <!-- ========== 查询区 ========== -->
    <div id="querySection">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入焊缝编号、管线号或焊工号...">
            <button onclick="searchWeld()">查询</button>
        </div>

        <div class="stat">
            <div class="stat-item"><span id="totalCount">0</span><label>总焊口数</label></div>
            <div class="stat-item"><span id="weldedCount">0</span><label>已焊接</label></div>
            <div class="stat-item"><span id="notWeldedCount">0</span><label>未焊接</label></div>
        </div>

        <div class="card" id="resultArea">请输入关键词进行查询...</div>
    </div>

    <!-- ========== 管理入口 ========== -->
    <div class="admin-entry">
        <a onclick="showAdminLogin()">⚙️ 管理入口</a>
    </div>

    <!-- ========== 密码框（默认隐藏） ========== -->
    <div id="adminLogin" class="hidden card" style="max-width:300px; margin:20px auto;">
        <h3 style="text-align:center; margin-top:0;">管理员登录</h3>
        <input type="password" id="adminPwd" placeholder="请输入密码" style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #ccc; border-radius:5px;">
        <button class="full-btn green" onclick="adminLogin()">进入控制台</button>
    </div>

    <!-- ========== 控制台区（默认隐藏） ========== -->
    <div id="adminSection" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h2 style="margin:0; font-size:18px;">📊 控制台</h2>
            <button class="gray" onclick="exitAdmin()">退出控制台</button>
        </div>

        <div class="card" style="padding:8px;">
            <label style="font-size:13px;">日期筛选：</label>
            <input type="date" id="filterDay" onchange="renderAll()" style="padding:5px; border:1px solid #ccc; border-radius:5px; font-size:13px;">
            <button class="gray" onclick="clearFilter()" style="padding:5px 10px; font-size:13px;">清除筛选</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>区域</th>
                        <th>管工</th>
                        <th>焊工</th>
                        <th>普工</th>
                        <th>管道安装<br>(寸)</th>
                        <th>管道预制<br>(寸)</th>
                        <th>支架安装<br>(个)</th>
                        <th>安装重量<br>(kg)</th>
                        <th>阀门安装<br>(台)</th>
                        <th>支架预制<br>(个)</th>
                        <th>预制重量<br>(kg)</th>
                        <th>包含2寸<br>以下(寸)</th>
                        <th>工作内容/备注</th>
                        <th>日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <button class="full-btn green" onclick="addRow()">➕ 新增一行记录</button>
        </div>

        <div class="summary" id="summaryBox"></div>
    </div>

    <!-- 加载焊口数据 -->
    <script src="data.js"></script>

    <script>
        // ================= 焊口查询 =================
        const localWeld = JSON.parse(localStorage.getItem('myWeldData') || '[]');
        const allWeldData = weldData.concat(localWeld);

        window.onload = function() {
            const total = allWeldData.length;
            const welded = allWeldData.filter(item => item.焊接日期 && item.焊接日期.trim() !== "").length;
            document.getElementById('totalCount').innerText = total;
            document.getElementById('weldedCount').innerText = welded;
            document.getElementById('notWeldedCount').innerText = total - welded;
        };

        function searchWeld() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultArea = document.getElementById('resultArea');
            if (!keyword) { resultArea.innerHTML = "请输入关键词进行查询..."; return; }

            const results = allWeldData.filter(item => {
                return (item.焊缝编号 && item.焊缝编号.toLowerCase().includes(keyword)) ||
                       (item.管线号 && item.管线号.toLowerCase().includes(keyword)) ||
                       (item.焊工号根层 && item.焊工号根层.toLowerCase().includes(keyword)) ||
                       (item.图纸号 && item.图纸号.toLowerCase().includes(keyword)) ||
                       (item.区域 && item.区域.toLowerCase().includes(keyword)) ||
                       (item.介质 && item.介质.toLowerCase().includes(keyword));
            });

            if (results.length === 0) { resultArea.innerHTML = "没有找到匹配的焊口。"; return; }

            let html = "";
            results.slice(0, 50).forEach(item => {
                html += `
                    <div class="result-item">
                        <h3>焊口：${item.焊缝编号 || '无'}</h3>
                        <p><strong>归属队伍：</strong>${item.施工承包商 || '无'}</p>
                        <p><strong>管线号：</strong>${item.管线号 || '无'}</p>
                        <p><strong>图号：</strong>${item.图纸号 || '无'}</p>
                        <p><strong>区域：</strong>${item.区域 || '无'} | <strong>介质：</strong>${item.介质 || '无'}</p>
                        <p><strong>规格：</strong>${item.外径1 || '?'}×${item.厚度1 || '?'}</p>
                        <p><strong>材质：</strong>${item.母材材质1 || '无'} | <strong>炉批号：</strong>${item.炉批号1 || '无'}</p>
                        <p><strong>焊工：</strong>${item.焊工号根层 || '无'} | <strong>焊接日期：</strong>${item.焊接日期 || '未焊'}</p>
                        <div class="detect">
                            <p><strong>PT：</strong>${item.PT报告号 || '未委托'} | ${item.PT报告日期 || '无'} | ${item.PT检测结果 || '无'}</p>
                            <p><strong>RT：</strong>${item.RT报告号 || '未委托'} | ${item.RT报告日期 || '无'} | ${item.RT检测结果 || '无'}</p>
                            <p><strong>VT：</strong>${item.VT报告号 || '未委托'} | ${item.VT报告日期 || '无'} | ${item.VT检测结果 || '无'}</p>
                        </div>
                    </div>
                `;
            });
            if (results.length > 50) html += '<p style="color:#999;">（只显示前 50 条，请细化关键词）</p>';
            resultArea.innerHTML = html;
        }

        // ================= 控制台 =================
        const ADMIN_PWD = "123456";

        function showAdminLogin() {
            document.getElementById('adminLogin').classList.remove('hidden');
            document.getElementById('adminPwd').focus();
        }

        function adminLogin() {
            if (document.getElementById('adminPwd').value === ADMIN_PWD) {
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('querySection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                renderAll();
            } else {
                alert('密码错误！');
            }
        }

        function exitAdmin() {
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('querySection').classList.remove('hidden');
            document.getElementById('adminPwd').value = '';
        }

        function getRecords() {
            try { return JSON.parse(localStorage.getItem('workRecords') || '[]'); }
            catch (e) { return []; }
        }
        function setRecords(records) { localStorage.setItem('workRecords', JSON.stringify(records)); }

        function addRow() {
            const records = getRecords();
            records.push({
                id: Date.now(),
                team: '', guan: 0, han: 0, pu: 0,
                pipeInstall: 0, pipePre: 0, bracketInstall: 0, installWeight: 0,
                valve: 0, bracketPre: 0, preWeight: 0, under2: 0,
                work: '', date: new Date().toISOString().slice(0, 10)
            });
            setRecords(records); renderAll();
        }

        function deleteRow(id) {
            if (!confirm('确定删除这一行？')) return;
            setRecords(getRecords().filter(r => r.id !== id));
            renderAll();
        }

        function updateField(id, field, value) {
            const records = getRecords();
            const row = records.find(r => r.id === id);
            if (row) { row[field] = value; setRecords(records); renderSummary(); }
        }

        function clearFilter() {
            document.getElementById('filterDay').value = '';
            renderAll();
        }

        function renderTable() {
            const day = document.getElementById('filterDay').value;
            let records = getRecords();
            if (day) records = records.filter(r => r.date === day);

            const tbody = document.getElementById('tableBody');
            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="15" style="color:#999; padding:20px;">暂无记录，点下方“新增一行记录”开始录入</td></tr>';
                return;
            }
            const numCols = ['guan','han','pu','pipeInstall','pipePre','bracketInstall','installWeight','valve','bracketPre','preWeight','under2'];
            let html = '';
            records.forEach(r => {
                html += '<tr>';
                html += '<td><input type="text" class="wide" value="' + (r.team || '') + '" onchange="updateField(' + r.id + ', \'team\', this.value)" placeholder="区域"></td>';
                numCols.forEach(f => {
                    html += '<td><input type="number" step="0.01" value="' + (r[f] || '') + '" onchange="updateField(' + r.id + ', \'' + f + '\', this.value)"></td>';
                });
                html += '<td><input type="text" class="wide" value="' + (r.work || '') + '" onchange="updateField(' + r.id + ', \'work\', this.value)" placeholder="备注"></td>';
                html += '<td><input type="date" value="' + (r.date || '') + '" onchange="updateField(' + r.id + ', \'date\', this.value)"></td>';
                html += '<td><button class="red" onclick="deleteRow(' + r.id + ')">🗑️</button></td>';
                html += '</tr>';
            });
            tbody.innerHTML = html;
        }

        function renderSummary() {
            const day = document.getElementById('filterDay').value;
            let records = getRecords();
            if (day) records = records.filter(r => r.date === day);

            const sum = { guan:0, han:0, pu:0, pipeInstall:0, pipePre:0, bracketInstall:0, installWeight:0, valve:0, bracketPre:0, preWeight:0, under2:0 };
            records.forEach(r => Object.keys(sum).forEach(k => { sum[k] += parseFloat(r[k]) || 0; }));

            document.getElementById('summaryBox').innerHTML =
                '<div class="sum-item"><span>' + sum.guan + '</span><label>管工</label></div>' +
                '<div class="sum-item"><span>' + sum.han + '</span><label>焊工</label></div>' +
                '<div class="sum-item"><span>' + sum.pu + '</span><label>普工</label></div>' +
                '<div class="sum-item"><span>' + sum.pipeInstall + '</span><label>管道安装(寸)</label></div>' +
                '<div class="sum-item"><span>' + sum.pipePre + '</span><label>管道预制(寸)</label></div>' +
                '<div class="sum-item"><span>' + sum.bracketInstall + '</span><label>支架安装(个)</label></div>' +
                '<div class="sum-item"><span>' + sum.installWeight + '</span><label>安装重量(kg)</label></div>' +
                '<div class="sum-item"><span>' + sum.valve + '</span><label>阀门安装(台)</label></div>' +
                '<div class="sum-item"><span>' + sum.bracketPre + '</span><label>支架预制(个)</label></div>' +
                '<div class="sum-item"><span>' + sum.preWeight + '</span><label>预制重量(kg)</label></div>' +
                '<div class="sum-item"><span>' + sum.under2 + '</span><label>包含2寸以下(寸)</label></div>';
        }

        function renderAll() { renderTable(); renderSummary(); }
    </script>

    <!-- 离线缓存 -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('Service Worker 注册成功'))
                .catch(err => console.log('注册失败:', err));
        }
    </script>

</body>
</html>
