<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焊口查询系统</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial; margin: 0; padding: 15px; background: #f5f5f5; }
        h1 { font-size: 20px; text-align: center; color: #333; }
        .search-box { display: flex; margin-bottom: 15px; }
        input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px 0 0 5px; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 0 5px 5px 0; }
        .stat { display: flex; justify-content: space-around; margin-bottom: 15px; background: #fff; padding: 10px; border-radius: 5px; }
        .stat-item { text-align: center; }
        .stat-item span { display: block; font-size: 24px; font-weight: bold; color: #007bff; }
        .stat-item label { font-size: 12px; color: #666; }
        .result { background: white; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>焊口查询系统</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="输入焊缝编号、管线号或焊工号...">
        <button onclick="searchWeld()">查询</button>
    </div>

    <div class="stat">
        <div class="stat-item"><span id="totalCount">0</span><label>总焊口数</label></div>
        <div class="stat-item"><span id="weldedCount">0</span><label>已焊接</label></div>
        <div class="stat-item"><span id="notWeldedCount">0</span><label>未焊接</label></div>
    </div>

    <div class="result" id="resultArea">请输入关键词进行查询...</div>

    <!-- 加载数据 -->
    <script src="data.js"></script>

    <script>
        // 页面加载时统计
        window.onload = function() { updateStats(); };

        function updateStats() {
            const total = weldData.length;
            const welded = weldData.filter(item => item.焊接日期 && item.焊接日期.trim() !== "").length;
            document.getElementById('totalCount').innerText = total;
            document.getElementById('weldedCount').innerText = welded;
            document.getElementById('notWeldedCount').innerText = total - welded;
        }

        function searchWeld() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultArea = document.getElementById('resultArea');

            if (!keyword) {
                resultArea.innerHTML = "请输入关键词进行查询...";
                return;
            }

            const results = weldData.filter(item => {
                return (item.焊缝编号 && item.焊缝编号.toLowerCase().includes(keyword)) ||
                       (item.管线号 && item.管线号.toLowerCase().includes(keyword)) ||
                       (item.焊工号根层 && item.焊工号根层.toLowerCase().includes(keyword));
            });

            if (results.length === 0) {
                resultArea.innerHTML = "没有找到匹配的焊口。";
                return;
            }

            let html = "";
            results.forEach(item => {
                html += `
                    <div style="border-bottom:1px solid #eee; padding:10px 0;">
                        <h3 style="margin:0 0 5px; color:#007bff;">焊口：${item.焊缝编号 || '无'}</h3>
                        <p style="margin:3px 0;"><strong>归属队伍：</strong>${item.施工承包商 || '无'}</p>
                        <p style="margin:3px 0;"><strong>管线号：</strong>${item.管线号 || '无'}</p>
                        <p style="margin:3px 0;"><strong>图号：</strong>${item.图纸号 || '无'}</p>
                        <p style="margin:3px 0;"><strong>区域：</strong>${item.区域 || '无'} | <strong>介质：</strong>${item.介质 || '无'}</p>
                        <p style="margin:3px 0;"><strong>规格：</strong>${item.外径1 || '?'}×${item.厚度1 || '?'}</p>
                        <p style="margin:3px 0;"><strong>材质：</strong>${item.母材材质1 || '无'} | <strong>炉批号：</strong>${item.炉批号1 || '无'}</p>
                        <p style="margin:3px 0;"><strong>焊工：</strong>${item.焊工号根层 || '无'} | <strong>焊接日期：</strong>${item.焊接日期 || '未焊'}</p>
                        <div style="background:#f9f9f9; padding:8px; border-radius:5px; margin-top:5px;">
                            <p style="margin:2px 0;"><strong>PT：</strong>${item.PT报告号 || '未委托'} | ${item.PT报告日期 || '无'} | ${item.PT检测结果 || '无'}</p>
                            <p style="margin:2px 0;"><strong>RT：</strong>${item.RT报告号 || '未委托'} | ${item.RT报告日期 || '无'} | ${item.RT检测结果 || '无'}</p>
                            <p style="margin:2px 0;"><strong>VT：</strong>${item.VT报告号 || '未委托'} | ${item.VT报告日期 || '无'} | ${item.VT检测结果 || '无'}</p>
                        </div>
                    </div>
                `;
            });
            resultArea.innerHTML = html;
        }
    </script>

    <!-- 注册 Service Worker，用于离线缓存 -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('Service Worker 注册成功'))
                .catch(err => console.log('注册失败:', err));
        }
    </script>

</body>
</html>
