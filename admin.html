<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台 - 工作量统计</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 10px; background: #f5f5f5; }
        h1 { font-size: 20px; text-align: center; color: #333; margin: 10px 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card { background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); overflow-x: auto; }
        button { padding: 8px 15px; font-size: 14px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button.green { background: #28a745; }
        button.red { background: #dc3545; }
        button.gray { background: #6c757d; }
        .full-btn { width: 100%; margin-top: 8px; padding: 12px; font-size: 16px; }

        table { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
        th, td { border: 1px solid #ddd; padding: 4px; text-align: center; }
        th { background: #f0f0f0; font-weight: bold; font-size: 11px; }
        td input { width: 55px; padding: 6px 3px; box-sizing: border-box; border: 1px solid #eee; border-radius: 3px; font-size: 12px; text-align: center; }
        td input.wide { width: 110px; text-align: left; }
        td input[type="date"] { width: 120px; }

        /* 底部汇总 */
        .summary { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: #fffbe6; border: 1px solid #ffe58f; border-radius: 8px; }
        .sum-item { text-align: center; min-width: 60px; padding: 5px 8px; background: #fff; border-radius: 5px; }
        .sum-item span { display: block; font-size: 18px; font-weight: bold; color: #d46b08; }
        .sum-item label { font-size: 11px; color: #666; }

        .login-box { max-width: 300px; margin: 50px auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 登录 -->
    <div id="loginBox" class="login-box card">
        <h2 style="text-align:center;">控制台登录</h2>
        <input type="password" id="adminPwd" placeholder="请输入管理员密码" style="width:100%; padding:10px; box-sizing:border-box; margin-bottom:10px; border:1px solid #ccc; border-radius:5px;">
        <button class="full-btn green" onclick="login()">登录</button>
    </div>

    <!-- 主界面 -->
    <div id="mainBox" class="hidden">
        <div class="top-bar">
            <h1>📊 控制台</h1>
            <button class="gray" onclick="logout()">退出</button>
        </div>

        <div class="card" style="padding:8px;">
            <label style="font-size:13px;">日期筛选：</label>
            <input type="date" id="filterDay" onchange="renderAll()" style="padding:5px; border:1px solid #ccc; border-radius:5px; font-size:13px;">
            <button class="gray" onclick="clearFilter()" style="padding:5px 10px; font-size:13px;">清除筛选</button>
        </div>

        <!-- 主表 -->
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>区域</th>
                        <th>管工</th>
                        <th>焊工</th>
                        <th>普工</th>
                        <th>管道安装<br>(寸)</th>
                        <th>管道预制<br>(寸)</th>
                        <th>支架安装<br>(个)</th>
                        <th>安装重量<br>(kg)</th>
                        <th>阀门安装<br>(台)</th>
                        <th>支架预制<br>(个)</th>
                        <th>预制重量<br>(kg)</th>
                        <th>包含2寸<br>以下(寸)</th>
                        <th>工作内容/备注</th>
                        <th>日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <button class="full-btn green" onclick="addRow()">➕ 新增一行记录</button>
        </div>

        <!-- 合计 -->
        <div class="summary" id="summaryBox"></div>

    </div>

    <script>
        const ADMIN_PWD = "123456";

        function login() {
            if (document.getElementById('adminPwd').value === ADMIN_PWD) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('mainBox').classList.remove('hidden');
                renderAll();
            } else {
                alert('密码错误！');
            }
        }

        function logout() { location.reload(); }

        function getRecords() {
            try { return JSON.parse(localStorage.getItem('workRecords') || '[]'); }
            catch (e) { return []; }
        }

        function setRecords(records) {
            localStorage.setItem('workRecords', JSON.stringify(records));
        }

        function addRow() {
            const records = getRecords();
            records.push({
                id: Date.now(),
                team: '', guan: 0, han: 0, pu: 0,
                pipeInstall: 0, pipePre: 0, bracketInstall: 0, installWeight: 0,
                valve: 0, bracketPre: 0, preWeight: 0, under2: 0,
                work: '', date: new Date().toISOString().slice(0, 10)
            });
            setRecords(records);
            renderAll();
        }

        function deleteRow(id) {
            if (!confirm('确定删除这一行？')) return;
            setRecords(getRecords().filter(r => r.id !== id));
            renderAll();
        }

        function updateField(id, field, value) {
            const records = getRecords();
            const row = records.find(r => r.id === id);
            if (row) {
                row[field] = value;
                setRecords(records);
                renderSummary();
            }
        }

        function clearFilter() {
            document.getElementById('filterDay').value = '';
            renderAll();
        }

        function renderTable() {
            const day = document.getElementById('filterDay').value;
            let records = getRecords();
            if (day) records = records.filter(r => r.date === day);

            const tbody = document.getElementById('tableBody');
            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="15" style="color:#999; padding:20px;">暂无记录，点下方“新增一行记录”开始录入</td></tr>';
                return;
            }

            const numCols = [
                ['guan', '管工'], ['han', '焊工'], ['pu', '普工'],
                ['pipeInstall', '管道安装'], ['pipePre', '管道预制'],
                ['bracketInstall', '支架安装'], ['installWeight', '安装重量'],
                ['valve', '阀门安装'], ['bracketPre', '支架预制'],
                ['preWeight', '预制重量'], ['under2', '包含2寸以下']
            ];

            let html = '';
            records.forEach(r => {
                html += '<tr>';
                html += '<td><input type="text" class="wide" value="' + (r.team || '') + '" onchange="updateField(' + r.id + ', \'team\', this.value)" placeholder="区域"></td>';
                numCols.forEach(([field]) => {
                    html += '<td><input type="number" step="0.01" value="' + (r[field] || '') + '" onchange="updateField(' + r.id + ', \'' + field + '\', this.value)"></td>';
                });
                html += '<td><input type="text" class="wide" value="' + (r.work || '') + '" onchange="updateField(' + r.id + ', \'work\', this.value)" placeholder="备注"></td>';
                html += '<td><input type="date" value="' + (r.date || '') + '" onchange="updateField(' + r.id + ', \'date\', this.value)"></td>';
                html += '<td><button class="red" onclick="deleteRow(' + r.id + ')">🗑️</button></td>';
                html += '</tr>';
            });
            tbody.innerHTML = html;
        }

        function renderSummary() {
            const day = document.getElementById('filterDay').value;
            let records = getRecords();
            if (day) records = records.filter(r => r.date === day);

            const sum = {
                guan: 0, han: 0, pu: 0,
                pipeInstall: 0, pipePre: 0, bracketInstall: 0, installWeight: 0,
                valve: 0, bracketPre: 0, preWeight: 0, under2: 0
            };

            records.forEach(r => {
                Object.keys(sum).forEach(k => {
                    sum[k] += parseFloat(r[k]) || 0;
                });
            });

            document.getElementById('summaryBox').innerHTML =
                '<div class="sum-item"><span>' + sum.guan + '</span><label>管工</label></div>' +
                '<div class="sum-item"><span>' + sum.han + '</span><label>焊工</label></div>' +
                '<div class="sum-item"><span>' + sum.pu + '</span><label>普工</label></div>' +
                '<div class="sum-item"><span>' + sum.pipeInstall + '</span><label>管道安装(寸)</label></div>' +
                '<div class="sum-item"><span>' + sum.pipePre + '</span><label>管道预制(寸)</label></div>' +
                '<div class="sum-item"><span>' + sum.bracketInstall + '</span><label>支架安装(个)</label></div>' +
                '<div class="sum-item"><span>' + sum.installWeight + '</span><label>安装重量(kg)</label></div>' +
                '<div class="sum-item"><span>' + sum.valve + '</span><label>阀门安装(台)</label></div>' +
                '<div class="sum-item"><span>' + sum.bracketPre + '</span><label>支架预制(个)</label></div>' +
                '<div class="sum-item"><span>' + sum.preWeight + '</span><label>预制重量(kg)</label></div>' +
                '<div class="sum-item"><span>' + sum.under2 + '</span><label>包含2寸以下(寸)</label></div>';
        }

        function renderAll() {
            renderTable();
            renderSummary();
        }
    </script>

</body>
</html>
