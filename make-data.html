<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成 data.js</title>
    <style>
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial; padding: 20px; background: #ededed; color: #1a1a1a; }
        h2 { color: #07C160; }
        textarea { width: 100%; height: 200px; padding: 10px; font-family: monospace; font-size: 12px; box-sizing: border-box; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; }
        button { padding: 12px 24px; background: #07C160; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 10px 0; font-weight: 600; }
        button:active { transform: scale(0.98); }
        .tip { background: #fff; padding: 12px 14px; border-left: 4px solid #07C160; border-radius: 6px; margin-bottom: 15px; font-size: 14px; color: #555; }
        .wrap { max-width: 760px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
<div class="wrap">
    <h2>第一步：把 CSV 内容粘贴到下面</h2>
    <div class="tip">
        💡 打开你的 CSV 文件（用记事本），<b>Ctrl+A 全选，Ctrl+C 复制</b>，然后粘贴到下面的框里。
    </div>
    <textarea id="csvInput" placeholder="在这里粘贴 CSV 的全部内容（包含第一行表头）..."></textarea>

    <button onclick="generate()">👉 生成 data.js 内容</button>

    <h2>第二步：复制下面的内容，粘贴到 data.js 里</h2>
    <div class="tip">
        💡 点击下面的框，<b>Ctrl+A 全选，Ctrl+C 复制</b>，然后粘贴到 data.js 文件里保存。
    </div>
    <textarea id="output" placeholder="生成的内容会出现在这里..." readonly></textarea>
</div>

    <script>
        function generate() {
            var csv = document.getElementById('csvInput').value.trim();
            if (!csv) { alert('请先粘贴 CSV 内容！'); return; }

            var lines = csv.split('\n');
            var headers = parseLine(lines[0]);
            var result = [];

            for (var i = 1; i < lines.length; i++) {
                var line = lines[i].trim();
                if (line === '') continue;
                var values = parseLine(line);
                var obj = {};
                for (var j = 0; j < headers.length; j++) {
                    obj[headers[j]] = values[j] !== undefined ? values[j] : '';
                }
                result.push(obj);
            }

            var jsContent = 'var weldData = ' + JSON.stringify(result) + ';';
            document.getElementById('output').value = jsContent;
            alert('生成成功！数据共 ' + result.length + ' 条。请复制下面的内容粘贴到 data.js。');
        }

        // 智能解析一行CSV（能处理带引号的逗号）
        function parseLine(line) {
            var result = [];
            var cur = '';
            var inQuote = false;
            for (var i = 0; i < line.length; i++) {
                var c = line[i];
                if (c === '"') {
                    inQuote = !inQuote;
                } else if (c === ',' && !inQuote) {
                    result.push(cur.trim());
                    cur = '';
                } else {
                    cur += c;
                }
            }
            result.push(cur.trim());
            return result;
        }
    </script>
</body>
</html>
